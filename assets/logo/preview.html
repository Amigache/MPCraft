<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MPCraft — logo options</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0b1622;
        color: #e6edf3;
        padding: 32px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p.note {
        color: #8b98a9;
        margin: 0 0 28px;
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
      }
      .card {
        border-radius: 16px;
        padding: 18px 14px 14px;
        text-align: center;
      }
      .dark {
        background: #0f1c2b;
        border: 1px solid #23374c;
      }
      .light {
        background: #f7fafc;
        border: 1px solid #d7e0ea;
        color: #0b1622;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        margin-top: 24px;
      }
      .small img {
        width: 48px;
        height: 48px;
      }
      .big img {
        width: 128px;
        height: 128px;
      }
      .name {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 10px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>MPCraft — five logos</h1>
    <p class="note">Same mark at 128 px and at 48 px, on the dark window and on a light surface.</p>

    <div class="row big">
      <div class="card dark"><img src="option-1.svg" alt="" /><div class="name">1 · the craft and its route</div></div>
      <div class="card dark"><img src="option-2.svg" alt="" /><div class="name">2 · the M of the mission</div></div>
      <div class="card dark"><img src="option-3.svg" alt="" /><div class="name">3 · waypoint and craft</div></div>
      <div class="card dark"><img src="option-4.svg" alt="" /><div class="name">4 · the horizon</div></div>
      <div class="card dark"><img src="option-5.svg" alt="" /><div class="name">5 · the link</div></div>
    </div>

    <div class="row small">
      <div class="card light"><img src="option-1.svg" alt="" /><div class="name">1</div></div>
      <div class="card light"><img src="option-2.svg" alt="" /><div class="name">2</div></div>
      <div class="card light"><img src="option-3.svg" alt="" /><div class="name">3</div></div>
      <div class="card light"><img src="option-4.svg" alt="" /><div class="name">4</div></div>
      <div class="card light"><img src="option-5.svg" alt="" /><div class="name">5</div></div>
    </div>
  </body>
</html>
