mpcraft-link = { workspace = true }
mpcraft-log = { workspace = true }
mpcraft-mavlink = { workspace = true }
mpcraft-mission = { workspace = true }
num-traits = { workspace = true }
mpcraft-params = { workspace = true }
mpcraft-plugin = { workspace = true }
mpcraft-settings = { workspace = true }
mpcraft-transport = { workspace = true }
mpcraft-vehicle = { workspace = true }
