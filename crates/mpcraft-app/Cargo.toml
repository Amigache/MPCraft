[package]
name = "mpcraft-app"
description = "Application orchestration for MPCraft: session supervisor and event bus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The tests that speak to a live simulator, under the same flag as the link crate: what they prove is what a
# scripted peer cannot imitate, and a suite that requires a simulator teaches everyone to ignore it.
sitl-tests = []

# The area that speaks to a board on a port rather than to a simulator. It needs the port named by
# MPCRAFT_HARDWARE_TARGET; without one the scripted board stands in, and the gate says so rather than reading
# the simulator's green as covering it.
hardware-tests = []

