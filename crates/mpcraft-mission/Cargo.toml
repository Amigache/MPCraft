[package]
name = "mpcraft-mission"
description = "Mission items, MAV_CMD metadata, fences and rallies for MPCraft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
mpcraft-mavlink = { workspace = true }
# `num-traits` is what the generated MAVLink enums implement `FromPrimitive` on, so it is
# the only way to turn a wire value back into a `MAV_CMD`. It is already in the dependency
# tree through `mavlink`, so it costs nothing to compile.
num-traits = { version = "0.2", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
