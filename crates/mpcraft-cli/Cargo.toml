[package]
name = "mpcraft-cli"
description = "The MPCraft command line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
# Named differently from the desktop binary so both can live in `target/release` side by side.
name = "mpcraft-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
mpcraft-app.workspace = true
mpcraft-geo.workspace = true
mpcraft-link.workspace = true
mpcraft-mavlink.workspace = true
mpcraft-mission.workspace = true
mpcraft-params.workspace = true
mpcraft-transport.workspace = true
mpcraft-vehicle.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
