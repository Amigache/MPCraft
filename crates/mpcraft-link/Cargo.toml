[package]
name = "mpcraft-link"
description = "Session, transactions, parameter and mission protocols for MPCraft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
dashmap.workspace = true
mpcraft-mavlink.workspace = true
mpcraft-mission.workspace = true
mpcraft-params.workspace = true
mpcraft-transport.workspace = true
mpcraft-vehicle.workspace = true
mpcraft-dronecan.workspace = true
num-traits.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# The tests that speak to a live simulator. They are behind a flag so that `cargo test` does not
# need one: what they prove is what a scripted peer cannot imitate, and a suite that requires a
# simulator teaches everyone to ignore it.
sitl-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
