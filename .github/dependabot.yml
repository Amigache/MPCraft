version: 2

# Updates arrive as pull requests against the integration branch, so they go through the same
# checks as a change of ours. Minor and patch updates are grouped into one pull request per
# ecosystem and majors are left to a person, because a major is a change of contract rather than a
# newer number: a security update still arrives on its own through Dependabot alerts.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/ui"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The actions are pinned by tag; a major of one is usually a runtime the runner already carries,
  # so they are grouped and read together rather than held back.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
