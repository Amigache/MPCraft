name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Cargo registry and build directory
        uses: Swatinem/rust-cache@v2

      - name: Install the Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the test suite
        run: cargo test --workspace

      - name: Build the workspace
        run: cargo build --workspace --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  sitl:
    name: SITL integration
    runs-on: ubuntu-latest
    # The integration suite drives a real ArduPilot simulator.
    #
    # The ArduPilot SITL image is not published anonymously, so this job runs the golden
    # file suite unconditionally and the live SITL suite only when an image is available.
    # The golden file is generated by an independent implementation of the MAVLink wire
    # format, which is what catches framing bugs.
    container:
      image: ghcr.io/ardupilot/sitl:latest

    services:
      sitl:
        image: ghcr.io/ardupilot/sitl:latest
        ports:
          - 14550:14550/udp

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run the golden file suite
        run: cargo test --workspace --test golden

      - name: Run the integration suite
        run: cargo test --workspace --features sitl-tests
        env:
          MPCRAFT_SITL_TARGET: udp:127.0.0.1:14550
