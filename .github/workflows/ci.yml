name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  branch-flow:
    name: The flow of the branches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    # A change reaches main only from develop, and develop is where the changes meet. Branch
    # protection makes this check required, so a pull request that skips the integration branch
    # cannot be merged even though it opened.
    steps:
      - name: A change reaches main only from develop
        run: |
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::A pull request to main has to come from develop. Open it against develop first."
            exit 1
          fi

  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Cargo registry and build directory
        uses: Swatinem/rust-cache@v2

      - name: Install the Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the test suite
        run: cargo test --workspace

      - name: Build the workspace
        run: cargo build --workspace --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  sitl:
    name: SITL integration
    runs-on: ubuntu-latest

    # Two halves, and they are not the same kind of gate.
    #
    # The half that needs no vehicle runs on the runner: the golden stream is read by a reader written
    # from the rules, and the fixture was written by an implementation that was not built from this crate,
    # so its green rests on two readers agreeing rather than on a mirror of the parser.
    #
    # The live half needs a vehicle, and the ArduPilot image is not published anonymously: the registry
    # answers 401 to an anonymous pull. A job that asks for it as a container or a service fails at
    # initialization, before any step runs, which says nothing about the code. So this job looks for the
    # image, names the gap when it cannot be pulled, and runs the live half — where it can fail — when it
    # can. Locally the same suite runs against a simulator started by scripts/sitl.ps1 with
    # MPCRAFT_SITL_LIVE=1, one connection per run.

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The workspace includes the desktop binary, and that needs the system libraries of the webview even
      # when nothing is built from them here: without them the suite does not compile, which is a fact about
      # the machine rather than about the code.
      - name: Install the Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Run the half that needs no vehicle
        run: cargo test --workspace

      - name: Look for a simulator
        id: sim
        run: |
          if docker pull ghcr.io/ardupilot/sitl:latest; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'HERRAMIENTA-AUSENTE: the image cannot be pulled anonymously, so no vehicle answered this half.'
          fi

      - name: Run the live half against the simulator
        if: steps.sim.outputs.available == 'true'
        env:
          MPCRAFT_SITL_TARGET: udp:127.0.0.1:14550
          # A vehicle is really on the wire here, so the suite reads it as a vehicle and not as the
          # scripted peer that stands in when nothing answers.
          MPCRAFT_SITL_LIVE: "1"
        run: |
          docker run -d --name mpcraft-sitl -p 14550:14550/udp -e HOME=/tmp \
            ghcr.io/ardupilot/sitl:latest /bin/sh -c \
            "cp -r /home/ardupilot/ardupilot /tmp/ardupilot && cd /tmp/ardupilot && \
             Tools/autotest/default_params.py Copter > /tmp/ardupilot/Parameters.parm && \
             Tools/autotest/sim_vehicle.py -v ArduCopter -D --out=UDP:127.0.0.1:14550 --model + --speedup 1"

          cargo test -p mpcraft-link --features sitl-tests -- --test-threads=1

      - name: Stop the simulator
        if: steps.sim.outputs.available == 'true'
        run: docker stop mpcraft-sitl

  bundle:
    name: Bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # The installers are built where the platform builds them: MSI and NSIS on Windows, deb and
    # AppImage on Linux, app and dmg on macOS. What each platform packages is named in its own
    # configuration file beside tauri.conf.json, so the three do not share one target list.
    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Cargo registry and build directory
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install the Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            file

      - name: Install the frontend dependencies
        run: npm ci

      # Which platform the manifest of the updater names this runner's output with. It is derived
      # from the runner rather than assumed, because macos-latest is an ARM machine now and an
      # entry filed under the wrong architecture is an update no machine reads.
      - name: Name the platform this runner builds
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Windows-X64) echo "key=windows-x86_64" >> "$GITHUB_OUTPUT" ;;
            Linux-X64) echo "key=linux-x86_64" >> "$GITHUB_OUTPUT" ;;
            macOS-ARM64) echo "key=darwin-aarch64" >> "$GITHUB_OUTPUT" ;;
            macOS-X64) echo "key=darwin-x86_64" >> "$GITHUB_OUTPUT" ;;
            *) echo "key=" >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac

      # The entry moves to the folder holding tauri.conf.json, which is where the CLI reads the
      # project from; --ci keeps it from waiting for a signing identity nobody gave it. A tag is
      # also signed for the updater, and its artifacts are the archives the release carries; a
      # change that is not a tag builds the installers only, so a pull request needs no secret.
      - name: Build the installers with update artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run bundle -- --ci --config tauri.updater.conf.json

      - name: Build the installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run bundle -- --ci

      # A build that wrote no installer has not packaged anything, so an empty upload is a failure
      # rather than a job that passed with nothing in it.
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: mpcraft-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error

      # The release carries the installers, the archives the updater installs and their
      # signatures. Each of the three jobs adds its own, and the first one creates the release.
      - name: Publish the installers and their signatures
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MPCraft ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/macos/**/*.tar.gz
            target/release/bundle/**/*.sig

      # One platform of the document the updater reads. The three are merged into one by the job
      # that runs after this matrix, because no job sees the output of the others.
      - name: Write this platform of the update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: .
        run: |
          node scripts/updater-manifest.js discover \
            --bundle target/release/bundle \
            --platform "${{ steps.platform.outputs.key }}" \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --out "latest-${{ steps.platform.outputs.key }}.json"

      - name: Keep this platform of the update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ runner.os }}
          path: latest-*.json
          if-no-files-found: error

  publish-manifest:
    name: Publish the update manifest
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # The three platforms are built by three jobs that never see each other, so each leaves its own
    # fragment and this job puts them together. The document is what the application reads to learn
    # that a newer version exists, and it is attached to the same release the installers are on.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: fragments
          merge-multiple: true

      - name: Merge the platforms into the document the updater reads
        run: node scripts/updater-manifest.js merge --out latest.json fragments/*.json

      - name: Attach the document to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber
