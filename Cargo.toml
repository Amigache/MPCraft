[workspace]
resolver = "2"
members = [
    "crates/mpcraft-mavlink",
    "crates/mpcraft-transport",
    "crates/mpcraft-vehicle",
    "crates/mpcraft-link",
    "crates/mpcraft-mission",
    "crates/mpcraft-geo",
    "crates/mpcraft-params",
    "crates/mpcraft-log",
    "crates/mpcraft-settings",
    "crates/mpcraft-plugin",
    "crates/mpcraft-winusb",
    "crates/mpcraft-ble",
    "crates/mpcraft-app",
    "crates/mpcraft-cli",
    "apps/desktop",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["MPCraft Contributors"]
repository = "https://github.com/Amigache/MPCraft"

[workspace.dependencies]
mpcraft-mavlink = { path = "crates/mpcraft-mavlink" }
mpcraft-transport = { path = "crates/mpcraft-transport" }
mpcraft-vehicle = { path = "crates/mpcraft-vehicle" }
mpcraft-link = { path = "crates/mpcraft-link" }
mpcraft-mission = { path = "crates/mpcraft-mission" }
mpcraft-geo = { path = "crates/mpcraft-geo" }
mpcraft-params = { path = "crates/mpcraft-params" }
mpcraft-log = { path = "crates/mpcraft-log" }
mpcraft-settings = { path = "crates/mpcraft-settings" }
mpcraft-plugin = { path = "crates/mpcraft-plugin" }
mpcraft-winusb = { path = "crates/mpcraft-winusb" }
mpcraft-ble = { path = "crates/mpcraft-ble" }
mpcraft-app = { path = "crates/mpcraft-app" }
mpcraft-cli = { path = "crates/mpcraft-cli" }

# `num-traits` is what the generated MAVLink enums implement `FromPrimitive` on, so it is
# how a wire value becomes an enumeration.
num-traits = { version = "0.2", default-features = false }

mavlink = { version = "0.20", default-features = false, features = [
    "std",
    "tokio",
    "serde",
    "format-generated-code",
    "mav2-message-signing",
    "mav2-message-extensions",
    "dialect-ardupilotmega",
    "dialect-common",
] }

serialport = { version = "4", default-features = false }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
dashmap = "6"
parking_lot = "0.12"
rayon = "1"
arc-swap = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1"
regex = "1"
flate2 = "1"
sha2 = "0.10"

# The signature of a firmware image for a board with secure boot. The curve and the encoding are
# the ones the published signer uses (Ed25519), so the rule is not re-derived here: what this
# workspace carries is the crate that implements it, and the layout of the image around it.
ed25519-dalek = { version = "2", features = ["pem"] }
getrandom = "0.2"

# The client that reaches the files of a companion computer over SSH. The cryptography is the
# backend the SSH library carries; this workspace does not implement a cipher of its own.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"

# The WASM runtime behind the plugin sandbox. It is the only runtime dependency in the workspace,
# and only `mpcraft-plugin` uses it: the layer above hands the sandbox a manifest and gets typed
# results back, so nothing else has to know that a runtime exists.
wasmtime = "50"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# The links of the system that reach a device on a USB bus. This is not a runtime dependency: what the crate
# carries are import names resolved by the loader (`windows-link` writes them as `kind = "raw-dylib"`, which is
# what makes it link with the toolchain the gates use), so nothing has to be installed for it to work. It is used
# only behind `hardware-tests`, because the layer that reaches a physical bus is the application's, not one below
# it, and the plugin sandbox stays the only place this project carries a runtime.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Devices_Usb",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

geo = "0.31"
geo-types = "0.7"

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1
